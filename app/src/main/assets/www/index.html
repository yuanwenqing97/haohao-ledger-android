function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function freshState(){return {version:1,transactions:[],accounts:[...DEFAULT_ACCOUNTS],categories:{expense:EXPENSE_DEFAULT.map(x=>({name:x[0],icon:x[1],color:x[2]})),income:INCOME_DEFAULT.map(x=>({name:x[0],icon:x[1],color:x[2]}))},budgets:{overall:5000,categories:{餐饮:1200,交通:400,购物:600,居家:500,孩子:800,娱乐:300,日用:300}},createdAt:new Date().toISOString()}}
function loadState(){try{const s=JSON.parse(localStorage.getItem(STORE_KEY));if(s&&Array.isArray(s.transactions)&&s.categories&&Array.isArray(s.accounts))return {...freshState(),...s,budgets:{...freshState().budgets,...s.budgets,categories:{...freshState().budgets.categories,...(s.budgets?.categories||{})}}}}catch(e){}return freshState()}
let state=loadState(); let page='dashboard'; let activeMonth=monthStr(); let modalType=null; let editingId=null; let formType='expense'; let selectedCategory='餐饮'; let toastTimer; let deferredInstallPrompt=null;
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));return true}catch(e){notify('浏览器存储失败，请导出备份或清理空间');return false}}
function notify(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}
function cats(type){return state.categories[type]||[]}
function catObj(type,name){return cats(type).find(c=>c.name===name)||{name,icon:type==='income'?'＋':'✳️',color:'#9ca89f'}}
function txsFor(month,txs=state.transactions){return txs.filter(t=>!month||t.date.startsWith(month))}
function sumType(txs,type){return txs.filter(t=>t.type===type).reduce((s,t)=>s+Number(t.amount||0),0)}
function monthStats(month=activeMonth){const tx=txsFor(month);return {tx,income:sumType(tx,'income'),expense:sumType(tx,'expense'),count:tx.length}}
function dateLabel(s){if(!s)return '';const d=new Date(s+'T00:00:00');return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`}
function shortDate(s){if(!s)return '';let [,m,d]=s.split('-');return `${Number(m)}月${Number(d)}日`}
function header(title,sub,actions=''){return `<header class="topbar"><div><div class="eyebrow">PERSONAL FINANCE · 个人财务</div><h1 class="page-title">${title}</h1><div class="page-sub">${sub}</div></div><div class="top-actions">${actions}<button class="btn btn-soft" data-action="install-app" type="button">⇧ 安装到手机</button></div></header>`}
function monthPicker(month=activeMonth){return `<div class="month-chip"><span>▦</span><input aria-label="选择月份" id="global-month" type="month" value="${month}" style="border:0;background:transparent;outline:0;color:inherit;width:120px" /></div>`}
function addButton(label='记一笔'){return `<button class="btn btn-primary" data-action="add-tx"><span style="font-size:17px">＋</span>${label}</button>`}
function statCard(label,value,icon,foot='',tone=''){return `<article class="panel stat-card"><div class="stat-head"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-number" ${tone?`style="color:${tone}"`:''}>${value}</div><div class="stat-foot">${foot}</div></article>`}
function emptyState(text='还没有记账记录',desc='记下第一笔收支，开始看清自己的钱花在哪里。',button=true){return `<div class="empty-state"><div class="empty-icon">✎</div><h3>${text}</h3><p>${desc}</p>${button?addButton('记录第一笔'):''}</div>`}
function calcDailyAvg(month,expense){const [y,m]=month.split('-').map(Number);const days=new Date(y,m,0).getDate();return expense/Math.max(1,Math.min(days,month===monthStr()?new Date().getDate():days))}
function recentTable(txs,limit=6){const list=[...txs].sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt)).slice(0,limit);if(!list.length)return emptyState();return `<div class="table-panel"><table class="transaction-table"><thead><tr><th>项目</th><th>金额</th><th>日期 · 账户</th><th>备注</th><th></th></tr></thead><tbody>${list.map(t=>txRow(t,false)).join('')}</tbody></table></div>`}
function txRow(t,actions=true){const c=catObj(t.type,t.category);return `<tr><td><div class="category-cell"><div class="cat-icon" style="background:${c.color}18">${c.icon}</div><div><div class="cat-title">${escapeHtml(t.category)}</div><div class="cat-sub">${escapeHtml(t.note|| (t.type==='expense'?'支出':'收入'))}</div></div></div></td><td><span class="amount ${t.type}">${t.type==='expense'?'−':'+'}${money(t.amount)}</span></td><td><div style="font-size:12px">${shortDate(t.date)}</div><div class="cat-sub">${escapeHtml(t.account||'未指定账户')}</div></td><td class="muted" style="font-size:12px;max-width:200px;overflow-wrap:anywhere">${escapeHtml(t.note||'—')}</td><td>${actions?`<div class="table-actions"><button class="text-btn" data-action="edit-tx" data-id="${t.id}">编辑</button><button class="text-btn" data-action="delete-tx" data-id="${t.id}">删除</button></div>`:''}</td></tr>`}
function svgTrend(month){const data=[];for(let i=5;i>=0;i--){let m=shiftMonth(month,-i),st=monthStats(m);data.push({m,label:m.slice(5)+'月',expense:st.expense,income:st.income})}const max=Math.max(100,...data.flatMap(d=>[d.expense,d.income]));const W=540,H=210,L=42,R=10,T=15,B=27,iw=W-L-R,ih=H-T-B;const x=i=>L+(iw/(Math.max(1,data.length-1)))*i;const y=v=>T+ih-(v/max)*ih;const path=key=>data.map((d,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(d[key]).toFixed(1)).join(' ');const area=path('expense')+` L${x(data.length-1)},${T+ih} L${x(0)},${T+ih} Z`;return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="近六个月收支趋势"><defs><linearGradient id="greenFade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2b8a60" stop-opacity=".16"/><stop offset="1" stop-color="#2b8a60" stop-opacity="0"/></linearGradient></defs>${[0,.25,.5,.75,1].map(p=>`<line class="chart-grid" x1="${L}" x2="${W-R}" y1="${T+ih*p}" y2="${T+ih*p}"/><text class="chart-label" x="${L-8}" y="${T+ih*p+3}" text-anchor="end">${p===0?'0':max*(1-p)>=10000?(max*(1-p)/10000).toFixed(1)+'万':Math.round(max*(1-p))}</text>`).join('')}<path class="chart-area" d="${area}"/><path class="chart-line" d="${path('expense')}"/><path class="chart-line2" d="${path('income')}"/>${data.map((d,i)=>`<circle class="chart-point" cx="${x(i)}" cy="${y(d.expense)}" r="3.5"/><text class="chart-label" x="${x(i)}" y="${H-7}" text-anchor="middle">${d.label}</text>`).join('')}</svg></div>`}
function categoryTotals(month,type='expense'){const tx=txsFor(month).filter(t=>t.type===type);const map={};tx.forEach(t=>map[t.category]=(map[t.category]||0)+Number(t.amount));return Object.entries(map).map(([name,value])=>({name,value,...catObj(type,name)})).sort((a,b)=>b.value-a.value)}
function categoryDonut(month){const list=categoryTotals(month).slice(0,6);const total=list.reduce((s,x)=>s+x.value,0);if(!total)return `<div class="empty-state" style="padding:30px 0"><div class="empty-icon">◔</div><h3>这个月还没有支出</h3><p>记下一笔支出后，这里会显示分类占比。</p></div>`;let sum=0;const colors=list.map(x=>x.color);const conic=list.map((x,i)=>{const start=sum;sum+=x.value/total*100;return `${x.color} ${start}% ${sum}%`}).join(',');return `<div class="donut-layout"><div class="donut" style="background:conic-gradient(${conic})"><div class="donut-center"><span>本月支出</span><strong>${total>=10000?(total/10000).toFixed(1)+'万':fmt(total,0)}</strong></div></div><div class="legend-list">${list.map((x,i)=>`<div class="legend-item"><span class="legend-swatch" style="background:${x.color}"></span><span class="legend-name">${escapeHtml(x.name)}</span><span class="legend-val">${(x.value/total*100).toFixed(0)}%</span></div>`).join('')}</div></div>`}
function renderDashboard(){const s=monthStats();const prev=monthStats(shiftMonth(activeMonth,-1));const incomeDiff=prev.income?((s.income-prev.income)/prev.income*100):null;const expenseDiff=prev.expense?((s.expense-prev.expense)/prev.expense*100):null;const d=calcDailyAvg(activeMonth,s.expense);const actions=`${monthPicker()}${addButton()}`;return `${header('收支总览','你的每一笔收入和支出，都在这里一目了然。',actions)}<section class="grid stats-grid">${statCard('本月支出',money(s.expense),'↘',expenseDiff===null?'从本月开始记录':`较上月 <span class="${expenseDiff>0?'down':'up'}">${expenseDiff>0?'+':''}${fmt(expenseDiff,1)}%</span>`, '')}${statCard('本月收入',money(s.income),'↗',incomeDiff===null?'从本月开始记录':`较上月 <span class="${incomeDiff<0?'down':'up'}">${incomeDiff>0?'+':''}${fmt(incomeDiff,1)}%</span>`,'var(--green)')}${statCard('本月结余',money(s.income-s.expense),'◈','收入 − 支出',(s.income-s.expense)>=0?'var(--green)':'var(--red)')}${statCard('日均支出',money(d),'◷',`本月已记录 ${s.count} 笔`,'')}</section><section class="grid dashboard-grid"><article class="panel"><div class="panel-head"><div><div class="panel-title">收支趋势</div><div class="panel-desc">近六个月的收入与支出变化</div></div><div class="trend-legend"><span><i class="dot" style="background:var(--green)"></i>支出</span><span><i class="dot" style="background:#d4a35a"></i>收入</span></div></div><div class="panel-body">${svgTrend(activeMonth)}</div></article><article class="panel"><div class="panel-head"><div><div class="panel-title">支出分类</div><div class="panel-desc">看看钱主要花在哪里</div></div><button class="text-btn" data-page="analytics">详细分析 →</button></div><div class="panel-body">${categoryDonut(activeMonth)}</div></article></section><section class="panel"><div class="panel-head"><div><div class="panel-title">最近流水</div><div class="panel-desc">${activeMonth.replace('-',' 年 ')} 月的最近记录</div></div><button class="btn btn-sm" data-page="transactions">查看全部流水 →</button></div>${s.tx.length?recentTable(s.tx,5):emptyState()}</section>`}
function renderTransactions(){let tx=state.transactions;return `${header('全部流水','集中查找、筛选或修改你记下的每一笔账。',addButton())}<section class="panel" style="padding:17px;margin-bottom:15px"><form id="filter-form" class="filters"><input class="field search-field" name="q" id="q-filter" placeholder="搜索备注、分类、账户…" value="${escapeHtml(window.txFilters?.q||'')}"/><select class="select" name="month" id="tx-month"><option value="all">所有月份</option>${Array.from(new Set([activeMonth,...state.transactions.map(t=>t.date.slice(0,7))])).sort((a,b)=>b.localeCompare(a)).map(m=>`<option value="${m}" ${(window.txFilters?.month||activeMonth)===m?'selected':''}>${m.replace('-',' 年 ')} 月</option>`).join('')}</select><select class="select" name="type" id="tx-type"><option value="all">全部收支</option><option value="expense" ${window.txFilters?.type==='expense'?'selected':''}>仅支出</option><option value="income" ${window.txFilters?.type==='income'?'selected':''}>仅收入</option></select><select class="select" name="category" id="tx-category"><option value="all">全部分类</option>${[...new Set([...cats('expense'),...cats('income')].map(c=>c.name))].map(c=>`<option value="${escapeHtml(c)}" ${window.txFilters?.category===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}</select><button class="btn btn-primary" type="submit">搜索流水</button><button class="btn" type="button" data-action="clear-filters">重置</button></form></section><section class="panel table-panel"><div class="panel-head"><div><div class="panel-title">流水明细</div><div class="panel-desc">支出显示为负向记录，收入显示为正向记录</div></div><span class="data-count" id="tx-count"></span></div><div id="tx-results"></div></section>`}
function applyTxFilters(){const f=window.txFilters||{q:'',month:activeMonth,type:'all',category:'all'};let list=[...state.transactions];if(f.month&&f.month!=='all')list=list.filter(t=>t.date.startsWith(f.month));if(f.type&&f.type!=='all')list=list.filter(t=>t.type===f.type);if(f.category&&f.category!=='all')list=list.filter(t=>t.category===f.category);if(f.q){const q=f.q.toLowerCase();list=list.filter(t=>[t.note,t.category,t.account,t.amount,t.date].some(v=>String(v||'').toLowerCase().includes(q)))}list.sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt));return list}
function renderTxResults(){const root=$('#tx-results');if(!root)return;const list=applyTxFilters();const inc=sumType(list,'income'),exp=sumType(list,'expense');$('#tx-count').textContent=`${list.length} 笔 · 收入 ${money(inc)} · 支出 ${money(exp)}`;if(!list.length){root.innerHTML=emptyState('没有找到匹配的流水','试试换个关键词、月份或分类。',true);return}root.innerHTML=`<table class="transaction-table"><thead><tr><th>项目</th><th>金额</th><th>日期 · 账户</th><th>备注</th><th></th></tr></thead><tbody>${list.map(t=>txRow(t,true)).join('')}</tbody></table><div class="pagination"><span>共 ${list.length} 笔记录</span><span>收入 ${money(inc)}　支出 ${money(exp)}</span></div>`}
function renderBudgets(){const s=monthStats();const budget=Number(state.budgets.overall||0);const ratio=budget?s.expense/budget:0;const groups=Object.entries(state.budgets.categories||{}).map(([name,limit])=>({name,limit:Number(limit||0),spent:categoryTotals(activeMonth).find(c=>c.name===name)?.value||0,...catObj('expense',name)})).sort((a,b)=>b.spent-a.spent);return `${header('预算管理','提前设好边界，花钱更安心。',monthPicker())}<section class="grid budget-layout"><article class="panel budget-main"><div class="budget-hero"><div><div class="eyebrow">${activeMonth.replace('-',' 年 ')} 月 · 总预算</div><div class="budget-amount">${money(s.expense)} <span style="font-size:14px;color:var(--muted);font-weight:500">/ ${money(budget)}</span></div><div class="page-sub">${budget?`已使用 ${Math.min(999,ratio*100).toFixed(1)}% · 剩余 ${money(budget-s.expense)}`:'尚未设置总预算'}</div></div><button class="btn" data-action="edit-overall-budget">调整预算</button></div><div class="progress-track"><div class="progress-fill ${ratio>=1?'over':ratio>=.8?'warn':''}" style="width:${Math.min(100,ratio*100)}%"></div></div><div class="divider"></div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><div><div class="panel-title">分类预算</div><div class="panel-desc">为容易超支的类别设置上限</div></div><button class="btn btn-sm" data-action="edit-category-budgets">编辑分类预算</button></div>${groups.length?`<div class="budget-list">${groups.map(g=>{const r=g.limit?g.spent/g.limit:0;return `<div><div class="budget-item-head"><div class="budget-item-name"><span class="cat-icon" style="width:31px;height:31px;border-radius:10px;background:${g.color}18">${g.icon}</span>${escapeHtml(g.name)}</div><div class="budget-item-num"><strong>${money(g.spent)}</strong> / ${money(g.limit)}</div></div><div class="progress-track"><div class="progress-fill ${r>=1?'over':r>=.8?'warn':''}" style="width:${Math.min(100,r*100)}%"></div></div><div style="font-size:10px;color:var(--muted);margin-top:5px">${g.limit?(r>=1?`已超出 ${money(g.spent-g.limit)}`:`还可使用 ${money(g.limit-g.spent)}`):'尚未设置预算'}</div></div>`}).join('')}</div>`:emptyState('还没有分类预算','设置分类预算后，可以更清楚地控制每一类支出。',false)}</article><aside class="grid" style="gap:17px"><article class="panel budget-small"><h3>本月预算表现</h3><div style="display:flex;justify-content:space-between;align-items:end;margin:17px 0 13px"><div><div class="muted" style="font-size:11px">本月收入</div><div style="font-size:19px;font-weight:750;color:var(--green)">${money(s.income)}</div></div><div style="text-align:right"><div class="muted" style="font-size:11px">本月结余</div><div style="font-size:19px;font-weight:750">${money(s.income-s.expense)}</div></div></div><div class="divider"></div><div class="settings-row"><div><label>本月记录笔数</label><small>收入与支出合计</small></div><strong>${s.count} 笔</strong></div><div class="settings-row"><div><label>单笔最大支出</label><small>${(()=>{const tx=s.tx.filter(t=>t.type==='expense').sort((a,b)=>b.amount-a.amount)[0];return tx?escapeHtml(tx.category+' · '+shortDate(tx.date)):'暂无记录'})()}</small></div><strong>${(()=>{const tx=s.tx.filter(t=>t.type==='expense').sort((a,b)=>b.amount-a.amount)[0];return tx?money(tx.amount):'—'})()}</strong></div></article><article class="panel budget-small"><h3>预算小建议</h3><div class="quick-tip">${budget===0?'先设定一个月度总预算，再根据实际生活情况逐步调整。':ratio>=1?'当前支出已达到或超过总预算。可以看看分类明细，找出是否有可延后或减少的支出。':ratio>=.8?'预算使用已经超过 80%，接下来几天可以留意可选消费。':'预算不是限制生活，而是帮你把钱留给真正重要的事情。记账几周后，再按实际情况调整额度。'}</div></article></aside></section>`}
function renderAnalytics(){const s=monthStats();const totals=categoryTotals(activeMonth);const total=totals.reduce((a,x)=>a+x.value,0);const tx=txsFor(activeMonth).filter(t=>t.type==='expense');const weekdays=[0,0,0,0,0,0,0];tx.forEach(t=>{const d=new Date(t.date+'T00:00:00').getDay();weekdays[d]+=t.amount});const maxDay=Math.max(1,...weekdays);return `${header('收支分析','从分类、趋势和消费习惯里，找到适合自己的节奏。',monthPicker())}<section class="grid analytics-stats">${statCard('总支出',money(s.expense),'↘',`${s.tx.filter(t=>t.type==='expense').length} 笔支出记录`)}${statCard('总收入',money(s.income),'↗',`${s.tx.filter(t=>t.type==='income').length} 笔收入记录`,'var(--green)')}${statCard('收支差额',money(s.income-s.expense),'◈',s.income>=s.expense?'本月收入高于支出':'本月支出高于收入',s.income>=s.expense?'var(--green)':'var(--red)')}</section><section class="grid analytics-grid"><article class="panel"><div class="panel-head"><div><div class="panel-title">近六个月趋势</div><div class="panel-desc">以当前选择月份为终点</div></div></div><div class="panel-body">${svgTrend(activeMonth)}</div><div style="padding:0 21px 20px" class="trend-legend"><span><i class="dot" style="background:var(--green)"></i>支出</span><span><i class="dot" style="background:#d4a35a"></i>收入</span></div></article><article class="panel"><div class="panel-head"><div><div class="panel-title">支出构成</div><div class="panel-desc">${activeMonth.replace('-',' 年 ')} 月按分类统计</div></div></div><div class="panel-body">${totals.length?`<div class="category-breakdown">${totals.map(c=>`<div class="breakdown-row"><div class="breakdown-label"><span class="cat-icon" style="width:31px;height:31px;border-radius:10px;background:${c.color}18">${c.icon}</span><div><div style="font-size:12px;font-weight:650">${escapeHtml(c.name)}</div><div class="breakdown-detail">${(c.value/(total||1)*100).toFixed(1)}% · ${tx.filter(t=>t.category===c.name).length} 笔</div></div></div><strong style="font-size:12px">${money(c.value)}</strong><div class="breakdown-rail"><div style="width:${c.value/(total||1)*100}%;background:${c.color}"></div></div></div>`).join('')}</div>`:emptyState('暂无支出分类数据','记下几笔支出后，这里会自动生成分析。')}</div></article><article class="panel" style="grid-column:1/-1"><div class="panel-head"><div><div class="panel-title">一周消费分布</div><div class="panel-desc">按支出日期所在的星期统计（周一至周日）</div></div></div><div class="panel-body" style="padding-top:20px"><div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;align-items:end;height:145px">${['一','二','三','四','五','六','日'].map((w,i)=>{let v=weekdays[(i+1)%7];return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:7px"><div style="font-size:10px;color:var(--muted);white-space:nowrap">${v?money(v,0):'—'}</div><div style="width:min(32px,70%);height:${Math.max(4,v/maxDay*85)}px;background:${v===Math.max(...weekdays)&&v>0?'var(--green)':'#cfe5d5'};border-radius:7px 7px 2px 2px"></div><div style="font-size:11px;color:#68766c">周${w}</div></div>`}).join('')}</div></div></article></section>`}
function renderSettings(){return `${header('账本设置','管理账户、分类与数据备份。')}<section class="grid settings-grid"><article class="panel settings-card"><h3>支付账户</h3><p>给每笔流水标记资金从哪里进出，方便回查。</p><div id="accounts-list">${state.accounts.map((a,i)=>`<div class="settings-row"><div><label>${escapeHtml(a)}</label><small>流水账户</small></div><button class="text-btn" data-action="remove-account" data-index="${i}" ${state.accounts.length<=1?'disabled':''}>移除</button></div>`).join('')}</div><form id="add-account-form" class="inline-form"><input class="field" name="name" maxlength="20" required placeholder="添加账户，例如：信用卡"/><button class="btn btn-soft" type="submit">添加</button></form><div class="hint" style="margin-top:9px">删除账户不会删除历史流水，已存在的记录会保留原账户名称。</div></article><article class="panel settings-card"><h3>收支分类</h3><p>可添加自己的分类，让每笔账更贴近真实生活。</p><div style="margin-bottom:17px"><div style="font-size:12px;font-weight:700;margin-bottom:8px">支出分类</div><div class="category-tags">${cats('expense').map((c,i)=>`<span class="category-tag">${c.icon} ${escapeHtml(c.name)} <button aria-label="删除${escapeHtml(c.name)}分类" data-action="remove-category" data-type="expense" data-name="${escapeHtml(c.name)}">×</button></span>`).join('')}</div></div><div><div style="font-size:12px;font-weight:700;margin-bottom:8px">收入分类</div><div class="category-tags">${cats('income').map((c,i)=>`<span class="category-tag">${c.icon} ${escapeHtml(c.name)} <button aria-label="删除${escapeHtml(c.name)}分类" data-action="remove-category" data-type="income" data-name="${escapeHtml(c.name)}">×</button></span>`).join('')}</div></div><form id="add-category-form" class="inline-form"><select class="select" name="type"><option value="expense">支出分类</option><option value="income">收入分类</option></select><input class="field" name="name" maxlength="12" required placeholder="新分类名称"/><button class="btn btn-soft" type="submit">添加</button></form><div class="hint" style="margin-top:8px">删除分类不会删除历史记录，但该分类不再出现在新流水选项中。</div></article><article class="panel settings-card"><h3>数据备份与恢复</h3><p>备份文件包括流水、分类、账户和预算。换电脑或清理浏览器前建议先备份。</p><div class="settings-row"><div><label>导出完整备份</label><small>保存为 JSON 文件，可恢复全部账本设置</small></div><button class="btn btn-sm" data-action="export-json">导出备份</button></div><div class="settings-row"><div><label>导出流水表格</label><small>CSV 文件，可用 Excel 或表格软件打开</small></div><button class="btn btn-sm" data-action="export-csv">导出 CSV</button></div><div class="settings-row"><div><label>导入备份</label><small>通过之前导出的 JSON 恢复数据</small></div><button class="btn btn-sm" data-action="import-json">选择文件</button></div><input type="file" id="import-file" accept="application/json,.json" hidden/><div class="hint" style="margin-top:10px">导入会覆盖当前浏览器中的账本数据，导入前建议先导出一份当前备份。</div></article><article class="panel settings-card"><h3>账本与隐私</h3><p>这是一个离线优先的个人记账工具。</p><div class="settings-row"><div><label>当前数据存储</label><small>本浏览器的本地存储空间</small></div><span class="pill">仅本地</span></div><div class="settings-row"><div><label>流水总数</label><small>当前账本累计记录</small></div><strong>${state.transactions.length} 笔</strong></div><div class="settings-row"><div><label>恢复演示数据</label><small>添加一组示例流水，体验图表和筛选</small></div><button class="btn btn-sm" data-action="demo-data">添加示例</button></div><div class="divider"></div><div class="danger-zone"><strong>清空全部账本</strong><p style="font-size:11px;color:#986763;margin:5px 0 12px">删除当前账本内的所有流水。这个操作无法撤销，请先备份。</p><button class="btn btn-danger btn-sm" data-action="clear-all">清空账本数据</button></div></article></section>`}
function render(){const main=$('#main');if(page==='dashboard')main.innerHTML=renderDashboard();if(page==='transactions')main.innerHTML=renderTransactions();if(page==='budgets')main.innerHTML=renderBudgets();if(page==='analytics')main.innerHTML=renderAnalytics();if(page==='settings')main.innerHTML=renderSettings();$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='transactions')renderTxResults();renderModal()}
function goPage(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function openTxModal(id=null){editingId=id;const t=id?state.transactions.find(x=>x.id===id):null;formType=t?.type||'expense';selectedCategory=t?.category||cats(formType)[0]?.name||'';modalType='tx';renderModal(t||null)}
function renderModal(tx=null){const root=$('#modal-root');if(!modalType){root.innerHTML='';return}let html='';if(modalType==='tx'){const t=tx||(editingId?state.transactions.find(x=>x.id===editingId):null);const type=formType;const catsFor=cats(type);if(!catsFor.some(c=>c.name===selectedCategory))selectedCategory=catsFor[0]?.name||'';const d=t?.date||dateStr();html=`<div class="modal-backdrop" data-action="close-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><div class="modal-title" id="modal-title">${t?'编辑流水':'记一笔'}</div><div class="modal-sub">把每笔收支记清楚，之后更容易查找</div></div><button class="modal-close" data-action="close-modal" aria-label="关闭">×</button></div><div class="modal-content"><div class="type-switch"><button class="${type==='expense'?'active expense':''}" data-action="set-tx-type" data-type="expense">支出</button><button class="${type==='income'?'active income':''}" data-action="set-tx-type" data-type="income">收入</button></div><form id="tx-form"><input type="hidden" name="type" value="${type}"/><div class="form-grid"><div class="form-group full"><label for="tx-amount">金额（人民币）</label><input id="tx-amount" class="form-control amount-input" name="amount" type="number" min="0.01" max="999999999" step="0.01" required placeholder="0.00" value="${t?escapeHtml(t.amount):''}" autofocus/></div><div class="form-group full"><label>选择分类</label><div class="category-picker">${catsFor.map(c=>`<button type="button" class="category-option ${c.name===selectedCategory?'selected':''}" data-action="pick-category" data-name="${escapeHtml(c.name)}"><span class="emoji">${c.icon}</span><span>${escapeHtml(c.name)}</span></button>`).join('')}</div></div><div class="form-group"><label for="tx-date">日期</label><input id="tx-date" class="form-control" type="date" name="date" required value="${escapeHtml(d)}"/></div><div class="form-group"><label for="tx-account">账户</label><select id="tx-account" class="form-control" name="account">${state.accounts.map(a=>`<option value="${escapeHtml(a)}" ${(t?.account||state.accounts[0])===a?'selected':''}>${escapeHtml(a)}</option>`).join('')}</select></div><div class="form-group full"><label for="tx-note">备注（选填）</label><input id="tx-note" class="form-control" name="note" maxlength="120" placeholder="例如：午饭、地铁充值、孩子奶粉" value="${escapeHtml(t?.note||'')}"/></div></div><div class="form-actions"><button class="btn" type="button" data-action="close-modal">取消</button><button class="btn btn-primary" type="submit">${t?'保存修改':'保存流水'}</button></div></form></div></section></div>`}
else if(modalType==='overall-budget'){html=`<div class="modal-backdrop" data-action="close-backdrop"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div><div class="modal-title">设置月度总预算</div><div class="modal-sub">设置一个可持续执行的支出上限</div></div><button class="modal-close" data-action="close-modal">×</button></div><div class="modal-content"><form id="overall-budget-form"><div class="form-group"><label for="overall-budget">每月总预算（元）</label><input id="overall-budget" class="form-control amount-input" name="amount" type="number" min="0" step="100" required value="${Number(state.budgets.overall||0)}"/></div><div class="form-actions"><button class="btn" type="button" data-action="close-modal">取消</button><button class="btn btn-primary" type="submit">保存预算</button></div></form></div></section></div>`}
else if(modalType==='category-budgets'){html=`<div class="modal-backdrop" data-action="close-backdrop"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div><div class="modal-title">编辑分类预算</div><div class="modal-sub">金额设为 0 表示暂不设置该分类预算</div></div><button class="modal-close" data-action="close-modal">×</button></div><div class="modal-content"><form id="category-budgets-form"><div class="form-grid">${cats('expense').map(c=>`<div class="form-group"><label>${c.icon} ${escapeHtml(c.name)}（元）</label><input class="form-control" name="${escapeHtml(c.name)}" type="number" min="0" step="50" value="${Number(state.budgets.categories[c.name]||0)}"/></div>`).join('')}</div><div class="form-actions"><button class="btn" type="button" data-action="close-modal">取消</button><button class="btn btn-primary" type="submit">保存分类预算</button></div></form></div></section></div>`}root.innerHTML=html}
function closeModal(){modalType=null;editingId=null;renderModal()}
function downloadFile(name,content,type){if(window.AndroidBridge&&typeof window.AndroidBridge.saveBase64File==='function'){try{const bytes=new TextEncoder().encode(String(content));let binary='';const chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk){binary+=String.fromCharCode(...bytes.subarray(i,i+chunk))}window.AndroidBridge.saveBase64File(name,btoa(binary),String(type||'application/octet-stream'));return}catch(e){notify('导出失败，请重试');return}}const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJSON(){const pack={...state,exportedAt:new Date().toISOString(),app:'好好记账'};downloadFile(`好好记账备份_${dateStr()}.json`,JSON.stringify(pack,null,2),'application/json;charset=utf-8');notify('备份文件已导出')}
function csvCell(v){let s=String(v??'');return '"'+s.replace(/"/g,'""')+'"'}
function exportCSV(){const rows=[['日期','类型','金额（元）','分类','账户','备注'],...state.transactions.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type==='expense'?'支出':'收入',t.amount,t.category,t.account,t.note])];downloadFile(`好好记账流水_${dateStr()}.csv`,'\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');notify('CSV 流水已导出')}
function addDemo(){if(state.transactions.length&&!confirm('当前已有流水。继续添加示例数据会把示例记录混入你的账本，确定继续吗？'))return;const m=activeMonth;const ds=[`${m}-02`,`${m}-03`,`${m}-05`,`${m}-06`,`${m}-08`,`${m}-10`,`${m}-12`,`${m}-15`,`${m}-17`,`${m}-19`,`${m}-21`,`${m}-24`];const entries=[['expense',28,'餐饮','支付宝','午饭'],['expense',12,'交通','支付宝','地铁'],['expense',169,'居家','微信','日用品'],['income',13000,'工资','银行卡','月工资'],['expense',238,'孩子','微信','宝宝用品'],['expense',56,'餐饮','支付宝','晚餐'],['expense',35,'娱乐','微信','电影票'],['expense',99,'购物','支付宝','生活用品'],['expense',20,'交通','支付宝','公交'],['expense',128,'餐饮','微信','周末聚餐'],['expense',68,'日用','支付宝','纸巾洗护'],['income',320,'报销','银行卡','交通报销']];entries.forEach((e,i)=>state.transactions.push({id:uid(),type:e[0],amount:e[1],category:e[2],account:state.accounts.includes(e[3])?e[3]:state.accounts[0],note:e[4],date:ds[i],createdAt:new Date().toISOString()}));save();render();notify('已添加示例流水，可在设置中清空或删除')}
function validImported(s){return s&&Array.isArray(s.transactions)&&s.transactions.every(t=>t&&typeof t==='object'&&['income','expense'].includes(t.type)&&Number.isFinite(Number(t.amount))&&Number(t.amount)>=0&&/^\d{4}-\d{2}-\d{2}$/.test(t.date))}
function handleClick(e){const el=e.target.closest('[data-action],[data-page]');if(!el)return;if(el.dataset.page){goPage(el.dataset.page);return}const a=el.dataset.action;switch(a){case'add-tx':openTxModal();break;case'install-app':{if(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone){notify('已经作为独立应用打开');break}if(location.protocol==='file:'){alert('先将好好记账部署到 HTTPS 网址，再用手机浏览器打开网址安装。压缩包内的《手机安装说明》有详细步骤。');break}if(deferredInstallPrompt){deferredInstallPrompt.prompt();deferredInstallPrompt.userChoice.then(choice=>{if(choice.outcome==='accepted')notify('已开始安装好好记账');else notify('已取消安装')}).catch(()=>notify('请从浏览器菜单选择“安装应用”'));deferredInstallPrompt=null;break}if(/iphone|ipad|ipod/i.test(navigator.userAgent)){alert('iPhone 安装方法：请在 Safari 中打开这个网址，点“分享”按钮，再选择“添加到主屏幕”，最后点“添加”。');break}alert('如果没有自动弹出安装窗口，请打开浏览器菜单，选择“安装应用”或“添加到主屏幕”。如果当前仍在电脑本地文件中打开，请先把应用部署到 HTTPS 网址。');break}case'close-modal':closeModal();break;case'close-backdrop':if(e.target===el)closeModal();break;case'set-tx-type':{const oldForm=$('#tx-form');let keep={};if(oldForm){const fd=new FormData(oldForm);keep={amount:fd.get('amount'),date:fd.get('date'),account:fd.get('account'),note:fd.get('note')}}formType=el.dataset.type;selectedCategory=cats(formType)[0]?.name||'';renderModal();const nf=$('#tx-form');if(nf){for(const [k,v] of Object.entries(keep)){const input=nf.elements.namedItem(k);if(input&&v!==null&&v!==undefined)input.value=v}if(nf.elements.namedItem('account')&&!state.accounts.includes(keep.account))nf.elements.namedItem('account').value=state.accounts[0]}break}case'pick-category':selectedCategory=el.dataset.name;$$('.category-option',$('#modal-root')).forEach(b=>b.classList.toggle('selected',b.dataset.name===selectedCategory));break;case'edit-tx':openTxModal(el.dataset.id);break;case'delete-tx':{const t=state.transactions.find(t=>t.id===el.dataset.id);if(t&&confirm(`确定删除这笔${t.type==='expense'?'支出':'收入'} ${money(t.amount)}（${t.category}）吗？`)){state.transactions=state.transactions.filter(t=>t.id!==el.dataset.id);save();render();notify('流水已删除')}break}case'clear-filters':window.txFilters={q:'',month:activeMonth,type:'all',category:'all'};render();break;case'edit-overall-budget':modalType='overall-budget';renderModal();break;case'edit-category-budgets':modalType='category-budgets';renderModal();break;case'export-json':exportJSON();break;case'export-csv':exportCSV();break;case'import-json':$('#import-file').click();break;case'remove-account':{const i=Number(el.dataset.index);if(state.accounts.length<=1)return;if(confirm(`移除账户“${state.accounts[i]}”？历史流水不会删除。`)){state.accounts.splice(i,1);save();render();notify('账户已移除')}break}case'remove-category':{const type=el.dataset.type,name=el.dataset.name;if(cats(type).length<=1){notify('至少保留一个分类');return}if(confirm(`删除分类“${name}”？历史流水仍会保留该分类。`)){state.categories[type]=cats(type).filter(c=>c.name!==name);save();render();notify('分类已删除')}break}case'demo-data':addDemo();break;case'clear-all':if(confirm('确定清空所有流水、账户自定义分类和预算设置吗？此操作无法撤销。建议先导出备份。')){const n=freshState();state={...n,accounts:state.accounts.length?state.accounts:n.accounts};save();render();notify('账本已清空')}break}}
document.addEventListener('click',handleClick);
document.addEventListener('change',e=>{if(e.target.id==='global-month'&&e.target.value){activeMonth=e.target.value;render()} });
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id==='tx-form'){const fd=new FormData(f);const type=fd.get('type');const amount=Number(fd.get('amount'));const date=fd.get('date');if(!Number.isFinite(amount)||amount<=0||!date){notify('请填写有效的金额和日期');return}const record={id:editingId||uid(),type,amount:Math.round(amount*100)/100,category:selectedCategory,account:String(fd.get('account')||state.accounts[0]),note:String(fd.get('note')||'').trim(),date,createdAt:new Date().toISOString()};if(editingId){const idx=state.transactions.findIndex(t=>t.id===editingId);if(idx>=0)state.transactions[idx]={...state.transactions[idx],...record}}else state.transactions.push(record);activeMonth=date.slice(0,7);save();closeModal();render();notify(editingId?'修改已保存':'记账成功');return}if(f.id==='filter-form'){window.txFilters={q:String(new FormData(f).get('q')||'').trim(),month:String(new FormData(f).get('month')||'all'),type:String(new FormData(f).get('type')||'all'),category:String(new FormData(f).get('category')||'all')};renderTxResults();return}if(f.id==='overall-budget-form'){state.budgets.overall=Math.max(0,Number(new FormData(f).get('amount')||0));save();closeModal();render();notify('总预算已更新');return}if(f.id==='category-budgets-form'){const fd=new FormData(f);const obj={};for(const c of cats('expense'))obj[c.name]=Math.max(0,Number(fd.get(c.name)||0));state.budgets.categories=obj;save();closeModal();render();notify('分类预算已更新');return}if(f.id==='add-account-form'){const name=String(new FormData(f).get('name')||'').trim();if(!name)return;if(state.accounts.some(a=>a.toLowerCase()===name.toLowerCase())){notify('这个账户已经存在');return}state.accounts.push(name);save();render();notify('账户已添加');return}if(f.id==='add-category-form'){const fd=new FormData(f),type=String(fd.get('type')),name=String(fd.get('name')||'').trim();if(!name)return;if(cats(type).some(c=>c.name===name)){notify('这个分类已存在');return}cats(type).push({name,icon:type==='expense'?'✳️':'＋',color:'#91ab97'});save();render();notify('分类已添加');return}});
document.addEventListener('change',async e=>{if(e.target.id!=='import-file')return;const file=e.target.files?.[0];if(!file)return;try{const s=JSON.parse(await file.text());if(!validImported(s)){notify('文件格式不正确，未导入数据');return}if(!confirm(`备份包含 ${s.transactions.length} 笔流水。导入将覆盖当前账本，是否继续？`))return;const base=freshState();state={...base,...s,transactions:s.transactions.map(t=>({...t,id:String(t.id||uid()),amount:Number(t.amount),note:String(t.note||''),account:String(t.account||'银行卡')})),accounts:Array.isArray(s.accounts)&&s.accounts.length?s.accounts:base.accounts,categories:s.categories&&Array.isArray(s.categories.expense)&&Array.isArray(s.categories.income)?s.categories:base.categories,budgets:s.budgets||base.budgets};save();render();notify('备份导入成功')}catch(err){notify('读取文件失败，请检查文件是否完整')}finally{e.target.value=''}});
window.addEventListener('storage',e=>{if(e.key===STORE_KEY){state=loadState();render()}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;notify('好好记账已安装到手机')});
if(!window.AndroidBridge && 'serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
render();
})();
</script>
</body>
</html>
